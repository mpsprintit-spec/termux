name: Build ValTherOn Terminal APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'apply_to_termux.py'
      - '.github/workflows/build-ra-terminal.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'apply_to_termux.py'
      - '.github/workflows/build-ra-terminal.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TERMUX_PACKAGE_VARIANT: apt-android-7
      TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
      TERMUX_APK_VERSION_TAG: valtheron-v0.6-debug
    steps:
      - name: Clone RA Terminal repository
        uses: actions/checkout@v4
      - name: Check required patch files
        run: |
          set -euo pipefail
          for file in apply_to_termux.py android/RaTerminalChrome.java android/RaSystemHud.java android/RaSessionTabsView.java android/RaCommandPalette.java android/RaSplitLauncher.java; do
            if test ! -s "$file"; then
              echo "::error::Missing required ValTherOn native UI source $file."
              exit 1
            fi
          done
          test -s android/ra_launcher.xml
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          echo "Using runner Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - name: Clone official pinned Termux source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/termux/termux-app.git termux-app
          git -C termux-app checkout --quiet 8629e632fcb95da272221be327db653fb24befe9
          test "$(git -C termux-app rev-parse HEAD)" = 8629e632fcb95da272221be327db653fb24befe9
      - name: Validate and apply patch
        run: |
          python3 apply_to_termux.py termux-app --check-only
          python3 apply_to_termux.py termux-app
      - name: Allow larger Gradle wrapper download window
        working-directory: termux-app
        shell: bash
        run: |
          set -euo pipefail
          props=gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' "$props"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=180000/' "$props"
          else
            printf '\\nnetworkTimeout=180000\\n' >> "$props"
          fi
          grep '^networkTimeout=' "$props"
      - name: Fetch Gradle distribution with network retry
        working-directory: termux-app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Gradle distribution unavailable (attempt $attempt); retrying."
              sleep "$((attempt * 15))"
            fi
          done
          exit 1
      - name: Compile native UI independently of bootstrap download
        working-directory: termux-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac -x :app:downloadBootstraps --stacktrace
      - name: Build native Termux APK with bounded bootstrap retry
        working-directory: termux-app
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :app:assembleDebug --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build attempt $attempt failed; retrying transient dependency download."
              sleep "$((attempt * 12))"
            fi
          done
          exit 1
      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find termux-app/app/build/outputs/apk/debug -name '*universal.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          mkdir -p dist
          cp "$apk" dist/ValTherOn_Terminal_v0.6_universal_debug.apk
          (cd dist && sha256sum ValTherOn_Terminal_v0.6_universal_debug.apk > SHA256SUMS.txt)
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ValTherOn-Terminal-v0.6-APK
          path: dist/*
          if-no-files-found: error
