<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="sky"></canvas><script>
'use strict';
const cv=document.getElementById('sky'),c=cv.getContext('2d',{alpha:false});
let W=1,H=1,last=0,phase=0,raf=0,mode='eco',visible=true;
const stars=Array.from({length:34},(_,i)=>({x:(i*.6180339887499)%1,y:(i*.372983)%1,z:i%7===0?1.9:1.1}));
const nodes=Array.from({length:17},(_,i)=>({x:(i*.6180339887499)%1,y:(i*.321183)%1}));
function resize(){W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);let d=Math.min(devicePixelRatio||1,1.1);cv.width=Math.ceil(W*d);cv.height=Math.ceil(H*d);c.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
function stroke(col,w,a){c.strokeStyle=col;c.lineWidth=w;c.globalAlpha=a;c.stroke();c.globalAlpha=1}
function dot(x,y,r,col,a){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=col;c.globalAlpha=a;c.fill();c.globalAlpha=1}
function wave(y0,a,f,p){c.beginPath();for(let x=0;x<=W+14;x+=14){let y=y0+Math.sin(x*f+p)*a+Math.cos(x*f*.4-p*.6)*a*.32;if(x===0)c.moveTo(x,y);else c.lineTo(x,y)}}
function paint(t){
 c.fillStyle='#000';c.fillRect(0,0,W,H);
 let pts=nodes.map((n,i)=>({x:W*n.x+Math.sin(t*.15+i)*5,y:H*(.02+n.y*.26)+Math.cos(t*.12+i)*5}));
 for(let i=0;i<pts.length;i++){for(let j=i+1;j<Math.min(pts.length,i+5);j++){let a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<W*.45){c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);stroke('#00bfff',.8,.35*(1-d/(W*.7)))}}dot(pts[i].x,pts[i].y,i%5===0?2.4:1.4,i%5===0?'#bd63ff':'#35e8ff',.82)}
 for(let b=0;b<3;b++){let y=H*[.25,.55,.87][b]+Math.sin(t*.11+b)*H*.008,a=H*(b===1?.027:.018),f=.014+b*.002,p=t*(.20+b*.04);
  for(let k=0;k<4;k++){wave(y+k*3,a+k*.6,f,p+k*.2);stroke((k+b)%3===0?'#ab4cff':'#00d4f2',.9,.22)}
  wave(y+7,a+1,f,p+.35);stroke(b%2?'#ac4cff':'#00e4ff',7,.2);stroke(b%2?'#d678ff':'#2aebff',2.4,.9);
  wave(y+9,a,f,p+.39);stroke('#bbf6ff',.8,.63);
 }
 for(let k=0;k<10;k++){wave(H*(.73+k*.026),H*.013,.018,t*.2+k*.35);stroke(k%3===0?'#c152ff':'#0cbfe3',.7,k%3===0?.28:.23)}
 for(const s of stars){dot(((s.x+t*.0015)%1)*W,s.y*H+Math.sin(t*.25+s.x*14)*8,s.z,s.x>.5?'#9d5aff':'#22e5ff',.55)}
}
function frame(ms){raf=0;if(!visible||mode==='off')return;raf=requestAnimationFrame(frame);if(ms-last<(mode==='flow'?50:85))return;last=ms;paint(ms/1000)}
window.setRaPerformanceMode=function(s){mode=(s==='flow'||s==='off')?s:'eco';if(s==='off'){cancelAnimationFrame(raf);raf=0;paint(phase)}else if(!raf&&visible){last=0;raf=requestAnimationFrame(frame)}};
raf=requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{visible=!document.hidden;if(!visible){cancelAnimationFrame(raf);raf=0}else if(!raf&&mode!=='off'){last=0;raf=requestAnimationFrame(frame)}});
</script></body></html>
